name: Windows offline regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install source dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression with network and subprocess audit
        env:
          PYTHONUTF8: '1'
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_offline.py
